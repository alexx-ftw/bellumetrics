name: Supabase schema and staging sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: supabase-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link the Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase@2.101.0 link --project-ref dggbwsgoddbrxvojjojy

      - name: Push schema migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase@2.101.0 db push --linked

      - name: Stage The War Atlas import
        env:
          SUPABASE_URL: https://dggbwsgoddbrxvojjojy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run import:war-atlas

      - name: Lint the linked Supabase schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase@2.101.0 db lint --linked --level error --fail-on error --schema public

      - name: Run supabase test db supabase/tests/wiki_data_foundation_test.sql --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase@2.101.0 test db supabase/tests/wiki_data_foundation_test.sql --linked

  report:
    if: always()
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out reporting helper
        uses: actions/checkout@v4

      - name: Report the synchronization outcome
        uses: actions/github-script@v7
        env:
          SYNC_RESULT: ${{ needs.sync.result }}
        with:
          script: |
            const { reportSupabaseSync } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/report-supabase-sync.mjs`
            );
            await reportSupabaseSync({ github, context, syncResult: process.env.SYNC_RESULT });
