name: Supabase schema and staging sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: supabase-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link the Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase@2.101.0 link --project-ref dggbwsgoddbrxvojjojy

      - name: Push schema migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase@2.101.0 db push --linked

      - name: Stage The War Atlas import
        env:
          SUPABASE_URL: https://dggbwsgoddbrxvojjojy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run import:war-atlas

      - name: Lint the linked Supabase schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase@2.101.0 db lint --linked --level error --fail-on error --schema public

      - name: Run supabase test db supabase/tests/wiki_data_foundation_test.sql --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase@2.101.0 test db supabase/tests/wiki_data_foundation_test.sql --linked

  report:
    if: always()
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Report the synchronization outcome
        uses: actions/github-script@v7
        env:
          SYNC_RESULT: ${{ needs.sync.result }}
        with:
          script: |
            const title = "Supabase automation failure";
            const label = "automation";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "open",
                labels: label,
                per_page: 100,
              },
            );
            const issue = issues.find(
              (candidate) => !candidate.pull_request && candidate.title === title,
            );

            if (process.env.SYNC_RESULT === "failure") {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name: label, color: "B60205" });
              }

              const body = `Supabase synchronization failed in [workflow run ${context.runId}](${runUrl}).`;
              if (issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, labels: [label], body });
              }
            } else if (process.env.SYNC_RESULT === "success" && issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Supabase synchronization recovered in [workflow run ${context.runId}](${runUrl}).`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
            }
